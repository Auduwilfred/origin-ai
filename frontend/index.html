<!DOCTYPE html>
<html>
<head>
  <title>Cypher by Origin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }

    .chat-container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      padding-bottom: 100px;
    }

    .message {
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .assistant {
      background: #111;
      margin-right: auto;
    }

    .input-box {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      padding: 10px;
      border-top: 1px solid #222;
      display: flex;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #111;
      color: white;
    }

    button {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="chat-container" id="chat"></div>

<div class="input-box">
  <input id="input" placeholder="Ask Cypher..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API_URL = "https://origin-ai.onrender.com/chat";

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  addMessage(data.response, "assistant");
}
</script>

</body>
</html>
